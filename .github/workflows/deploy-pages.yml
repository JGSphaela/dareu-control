name: CI & Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native Instabox CI: each job gets a fresh Ubuntu 24.04 ephemeral VM, deleted after.
  # Zero billable GitHub Actions minutes. No persistent runner state.
  test-and-stage:
    name: Verify & Stage Pages Artifact
    runs-on: instabox-medium
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check ES modules
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run unit tests
        run: |
          node tests/protocol.test.mjs
          node tests/i18n.test.mjs

      - name: Stage static GitHub Pages bundle
        run: |
          mkdir -p _site
          cp index.html app.css .nojekyll _site/
          cp -r js assets _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    needs: test-and-stage
    runs-on: instabox-medium
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
